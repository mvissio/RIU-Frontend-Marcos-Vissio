<section class="heroes-page">
  <header class="heroes-page__header">
    <h1 class="heroes-page__title">
      Superhéroes
    </h1>

    <button
      mat-flat-button
      (click)="addHero()"
    >
      <mat-icon>add</mat-icon>
      Agregar héroe
    </button>
  </header>

  <mat-form-field
    class="heroes-page__search"
    appearance="outline"
  >
    <mat-label>Buscar héroe</mat-label>

    <mat-icon matPrefix>search</mat-icon>

    <input
      matInput
      type="search"
      placeholder="Nombre del héroe"
      (input)="onSearch($event)"
    />
  </mat-form-field>

  <div class="heroes-page__table-container">
    <table
      mat-table
      [dataSource]="paginatedHeroes()"
      class="heroes-page__table"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          Nombre
        </th>

        <td mat-cell *matCellDef="let hero">
          {{ hero.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="realName">
        <th mat-header-cell *matHeaderCellDef>
          Nombre real
        </th>

        <td mat-cell *matCellDef="let hero">
          {{ hero.realName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="universe">
        <th mat-header-cell *matHeaderCellDef>
          Universo
        </th>

        <td mat-cell *matCellDef="let hero">
          {{ hero.universe }}
        </td>
      </ng-container>

      <ng-container matColumnDef="powers">
        <th mat-header-cell *matHeaderCellDef>
          Poderes
        </th>

        <td mat-cell *matCellDef="let hero">
          {{ hero.powers.join(', ') }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          Acciones
        </th>

        <td mat-cell *matCellDef="let hero">
          <button
            mat-icon-button
            aria-label="Editar héroe"
            (click)="editHero(hero.id)"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            aria-label="Eliminar héroe"
            (click)="deleteHero(hero)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>
  </div>

  <mat-paginator
    class="heroes-page__paginator"
    [length]="filteredHeroes().length"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
    (page)="onPageChange($event)"
  ></mat-paginator>
</section>
